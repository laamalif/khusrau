name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run python test_norm.py
      - run: uv run python -m unittest -v test_integrity.py
      - run: uv run python -m compileall -q .
      - run: uv run python khusrau.py --help
